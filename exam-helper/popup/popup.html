<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Exam Helper</title>
  </head>
  <body>
    <div class="wrap">
      <h1>Exam Helper</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">读取中…</span>
      </div>
      <p class="hint">选中题目文字，答案气泡自动浮现在选区下方。</p>
      <p class="hint">
        按 <kbd>Alt</kbd>+<kbd>Q</kbd> 全局启用 / 禁用自动匹配。
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
