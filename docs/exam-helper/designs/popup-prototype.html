<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Helper — Popup 本机密钥原型</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #e8edf4;
        color: #2f3640;
        font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      }

      .stage-note {
        width: 320px;
        font-size: 12px;
        line-height: 1.7;
        color: #6b7380;
      }

      .popup {
        width: 320px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(47, 54, 64, 0.1);
        overflow: hidden;
      }

      .wrap {
        padding: 20px 20px 22px;
      }

      h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin-bottom: 14px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px 5px 8px;
        border-radius: 999px;
        background: #eef7f3;
        color: #3f6f5e;
        font-size: 12px;
        margin-bottom: 14px;
      }

      .status .glow {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5e8f7b;
        box-shadow: 0 0 0 4px rgba(94, 143, 123, 0.18);
      }

      .hint {
        font-size: 12.5px;
        color: #6b7380;
        line-height: 1.7;
      }

      .hint + .hint {
        margin-top: 4px;
      }

      kbd {
        display: inline-block;
        background: #f4f6fa;
        border-radius: 6px;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 11px;
        color: #2f3640;
      }

      .pass {
        margin-top: 18px;
        padding-top: 16px;
      }

      .pass-title {
        font-size: 13px;
        font-weight: 600;
      }

      .pass-sub {
        font-size: 11.5px;
        color: #6b7380;
        margin: 6px 0 12px;
        line-height: 1.6;
      }

      .pass-well {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .pass-well input {
        flex: 1;
        min-width: 0;
        height: 38px;
        border: 0;
        border-radius: 12px;
        background: #f4f6fa;
        color: #2f3640;
        font-size: 12px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        padding: 0 12px;
        outline: none;
      }

      .pass-well input:focus {
        box-shadow: 0 0 0 3px rgba(255, 229, 138, 0.85);
      }

      .pass-well input::placeholder {
        color: #9aa3ae;
        font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      .pass-well button {
        flex-shrink: 0;
        height: 38px;
        border: 0;
        border-radius: 12px;
        padding: 0 14px;
        background: #ffe58a;
        color: #2f3640;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .pass-well button:disabled {
        background: #eef1f6;
        color: #9aa3ae;
        cursor: not-allowed;
      }

      .pass-well.saved button {
        background: #5e8f7b;
        color: #fff;
      }

      .pass-meta {
        margin-top: 10px;
        font-size: 11.5px;
        color: #6b7380;
      }

      .pass-meta.ok {
        color: #3f6f5e;
      }

      .bubble-preview {
        width: 320px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(47, 54, 64, 0.1);
        border-radius: 16px;
        padding: 14px 16px;
        font-size: 13px;
        color: #c45c5c;
        box-shadow:
          0 14px 36px rgba(47, 54, 64, 0.14),
          0 1px 0 rgba(255, 255, 255, 0.9) inset;
        line-height: 1.6;
      }

      .bubble-preview .label {
        font-size: 11.5px;
        color: #6b7380;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <p class="stage-note">
      软白卡片、大圆角。答案用荧光笔黄标出来，不用装订线和直角。保存钮空着是浅黄，保存后变鼠尾草绿。
    </p>

    <div class="popup" role="dialog" aria-label="Exam Helper">
      <div class="wrap">
        <h1>Exam Helper</h1>
        <div class="status">
          <span class="glow"></span>
          已启用 · 自动匹配中
        </div>
        <p class="hint">选中题目文字，答案会轻轻浮在选区下面。</p>
        <p class="hint">按 <kbd>Alt</kbd> + <kbd>Q</kbd> 随时开关。</p>

        <section class="pass" aria-labelledby="pass-title">
          <div class="pass-title" id="pass-title">本机密钥</div>
          <p class="pass-sub">只留在这台电脑里，不会写进源码。</p>
          <div class="pass-well" id="well">
            <input
              id="key"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="粘贴 DeepSeek API key"
            />
            <button type="button" id="save" disabled>保存</button>
          </div>
          <p class="pass-meta" id="meta">还没填 — 题库没有的题暂时没法问 AI</p>
        </section>
      </div>
    </div>

    <div class="bubble-preview">
      <div class="label">未配置时的气泡</div>
      还没填写 DeepSeek 密钥，点工具栏图标打开弹窗即可
    </div>

    <script>
      const input = document.getElementById("key");
      const save = document.getElementById("save");
      const well = document.getElementById("well");
      const meta = document.getElementById("meta");

      input.addEventListener("input", function () {
        save.disabled = input.value.trim().length === 0;
      });

      save.addEventListener("click", function () {
        const value = input.value.trim();
        if (!value) return;
        const tail = value.slice(-4);
        input.value = "";
        save.disabled = true;
        well.classList.add("saved");
        meta.classList.add("ok");
        meta.textContent = "已保存在本机 · sk-••••" + tail;
      });
    </script>
  </body>
</html>
